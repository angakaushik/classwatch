<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassWatch Student</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 350px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.25rem;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--card-border);
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
      background: rgba(100, 116, 139, 0.15);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .status-badge.connecting {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.3);
      color: #fbbf24;
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .status-badge.locked {
      background: rgba(239, 68, 68, 0.25);
      border-color: var(--danger);
      color: #fca5a5;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .form-group {
      margin-bottom: 0.75rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      margin-bottom: 0.75rem;
    }

    .btn {
      flex: 1;
      padding: 0.6rem;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      transition: opacity 0.2s;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:not(:disabled):hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--card-border);
    }
    .btn-secondary:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-dashboard {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      border: none;
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.65rem;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn-dashboard:hover {
      opacity: 0.95;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:not(:disabled):hover {
      background: var(--danger);
      color: white;
    }

    /* Live Session Info Box */
    .session-info {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.8rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.35rem;
    }
    .info-row:last-child {
      margin-bottom: 0;
    }
    .info-label {
      color: var(--text-muted);
    }
    .info-value {
      font-weight: 600;
      font-family: monospace;
      color: #60a5fa;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Privacy Banner */
    .privacy-card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.74rem;
      line-height: 1.45;
      color: var(--text-muted);
    }

    .privacy-header {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">CW</div>
    <div class="title">ClassWatch Student</div>
  </div>

  <div class="status-badge" id="statusBadge">
    <span class="dot"></span>
    <span id="statusText">Disconnected</span>
  </div>

  <div class="form-group">
    <label for="serverUrl">Teacher Server (WS)</label>
    <input type="text" id="serverUrl" placeholder="ws://192.168.1.15:3000">
  </div>

  <div class="form-group">
    <label for="classCode">4-Digit Class Code</label>
    <input type="text" id="classCode" placeholder="e.g. 4821" maxlength="4">
  </div>

  <div class="form-group">
    <label for="studentName">Student Name</label>
    <input type="text" id="studentName" placeholder="Your full name">
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="joinBtn">Join Class</button>
    <button class="btn btn-danger" id="leaveBtn" disabled>Leave</button>
  </div>

  <!-- Study Dashboard Button -->
  <button class="btn btn-dashboard" id="openDashboardBtn">
    📖 Open My Study Dashboard
  </button>

  <div class="session-info" id="sessionInfo" style="display: none;">
    <div class="info-row">
      <span class="info-label">Active Site:</span>
      <span class="info-value" id="currentActiveDomain">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">Open Tabs:</span>
      <span class="info-value" id="currentTabCount">0</span>
    </div>
  </div>

  <!-- Updated Privacy Notice -->
  <div class="privacy-card">
    <div class="privacy-header">
      <span>🔒</span>
      <span>Privacy Notice</span>
    </div>
    <p>
      The teacher sees website names of open tabs and which one is active. The extension can show teacher messages on tabs. It never reads page titles, full URLs, page content, search queries, or private data.
    </p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
